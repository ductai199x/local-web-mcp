[project]
name = "local-web-mcp"
version = "0.1.0"
description = "Local web search / fetch MCP server for Claude Code (SearXNG, Crawl4AI, Scrapling, arXiv/alphaxiv)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawl4ai>=0.9.5",
    "ddgs>=9.16.1",
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "pymupdf>=2.0",
    "scrapling[fetchers]>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Collect only test_server.py: walking from the project root would make pytest
# scan the searxng/ checkout (including its own venv) on every run, which costs
# ~15s on Windows.
testpaths = ["test_server.py"]
addopts = "-q"
